<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fungi! · Panel</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; background: #12241a; color: #f3eedf; }
  header { padding: 22px 20px 6px; max-width: 980px; margin: auto; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 26px; color: #ffd84a; }
  .alt { opacity: .65; font-size: 13px; }
  main { max-width: 980px; margin: auto; padding: 10px 20px 40px; }
  .kutular { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .kutu { background: #1c3324; border: 1px solid #2c4a35; border-radius: 14px; padding: 14px 16px; }
  .kutu b { display: block; font-size: 30px; font-variant-numeric: tabular-nums; color: #fff; }
  .kutu span { font-size: 12.5px; opacity: .7; text-transform: uppercase; letter-spacing: .5px; }
  h2 { font-size: 16px; margin: 28px 0 10px; color: #ffd84a; }
  .kart { background: #1c3324; border: 1px solid #2c4a35; border-radius: 14px; padding: 14px 16px; }
  .cubuk { display: grid; grid-template-columns: 120px 1fr 52px; align-items: center; gap: 10px; margin: 7px 0; }
  .cubuk i { display: block; height: 16px; border-radius: 0 6px 6px 0; min-width: 2px; }
  .cubuk em { font-style: normal; text-align: right; font-variant-numeric: tabular-nums; }
  .ay { display: flex; gap: 8px; margin-bottom: 10px; font-size: 13px; flex-wrap: wrap; }
  .ay i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
  svg text { fill: #f3eedf; font-size: 11px; opacity: .7; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13.5px; }
  th, td { padding: 6px 8px; text-align: right; border-bottom: 1px solid #2c4a35; }
  th:first-child, td:first-child { text-align: left; }
  th { font-weight: 600; opacity: .7; }
  #durum { margin: 30px 0; opacity: .7; }
</style>
</head>
<body>
<header><h1>Fungi! · Oyun paneli</h1><span class="alt" id="zaman"></span></header>
<main>
  <div id="durum">Yükleniyor…</div>
  <div id="icerik" hidden>
    <div class="kutular" id="kutular"></div>
    <h2>Hangi oyun daha çok oynanıyor?</h2>
    <div class="kart" id="modlar"></div>
    <h2>Son 30 gün · başlatılan oyun</h2>
    <div class="kart"><div class="ay"><span><i style="background:#7fcf4f"></i>Saklambaç</span><span><i style="background:#e8402f"></i>Mantar Avı</span></div><div id="grafik"></div></div>
    <h2>En çok seçilen çocuklar</h2>
    <div class="kart" id="cocuklar"></div>
    <h2>Günlük döküm</h2>
    <div class="kart"><table id="tablo"></table></div>
  </div>
</main>
<script>
// Firebase RTDB'den REST ile okur (anonim oturum). Yalnızca sayaçlar var; kişisel veri yok.
const KEY = ['AIzaSyBqtoU6Drecy', 'hCvjYoWOtOcCyadNMDu5dY'].join('');
const DB = 'https://mindsharp-af404-default-rtdb.europe-west1.firebasedatabase.app';
const ADLAR = { ozgur: 'Özgür', deniz: 'Deniz', nil: 'Nil', leyla: 'Leyla', kerem: 'Kerem', zeynep: 'Zeynep', ayse: 'Ayşe', can: 'Can', mert: 'Mert', ali: 'Ali', elif: 'Elif', emre: 'Emre' };
const $ = id => document.getElementById(id);
const n = v => (v || 0).toLocaleString('tr-TR');
const topla = (o, ...k) => k.reduce((s, x) => s + (o[x] || 0), 0);
async function yukle() {
  let t = null; try { t = JSON.parse(localStorage.getItem('panelOturum')); } catch (e) {}
  if (!t || Date.now() - t.z > 50 * 60e3) { // anonim oturum 50 dk boyunca yeniden kullanılır
    const y = await (await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${KEY}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{"returnSecureToken":true}' })).json();
    if (!y.idToken) throw new Error('Oturum açılamadı'); t = { tok: y.idToken, z: Date.now() }; try { localStorage.setItem('panelOturum', JSON.stringify(t)); } catch (e) {}
  }
  const v = await (await fetch(`${DB}/saklambac/istatistik.json?auth=${t.tok}`)).json();
  if (v && v.error) { localStorage.removeItem('panelOturum'); throw new Error(v.error); }
  return v || {};
}
function ciz(v) {
  const T = v.toplam || {}, G = v.gunluk || {};
  const sobe = topla(T, 'tek_sobe', 'online_sobe'), mantar = topla(T, 'tek_mantar', 'online_mantar');
  const gunler = Object.keys(G).sort();
  const bugun = new Date(); const gunAd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const b = G[gunAd(bugun)] || {};
  let son7 = 0; for (let i = 0; i < 7; i++) { const d = new Date(bugun); d.setDate(d.getDate() - i); son7 += (G[gunAd(d)] || {}).oyun || 0; }
  $('kutular').innerHTML = [
    [n(T.oyun), 'Toplam oyun'], [n(T.acilis), 'Uygulama açılışı'], [n(b.oyun), 'Bugün oyun'], [n(son7), 'Son 7 gün oyun'],
    [n(topla(T, 'tur_sobe', 'tur_mantar')), 'Oynanan tur'], [n(topla(T, 'online_sobe', 'online_mantar')), 'Arkadaşlarla oyun'],
  ].map(([s, e]) => `<div class="kutu"><b>${s}</b><span>${e}</span></div>`).join('');
  const satirlar = [
    ['Saklambaç', sobe, '#7fcf4f', `${n(T.tek_sobe)} tek · ${n(T.online_sobe)} online · ${n(T.tur_sobe)} tur`],
    ['Mantar Avı', mantar, '#e8402f', `${n(T.tek_mantar)} tek · ${n(T.online_mantar)} online · ${n(T.tur_mantar)} tur`],
  ];
  const mx = Math.max(1, sobe, mantar), tp = Math.max(1, sobe + mantar);
  $('modlar').innerHTML = satirlar.map(([a, s, r, d]) => `<div class="cubuk"><span>${a}</span><i style="width:${s / mx * 100}%;background:${r}"></i><em>%${Math.round(s / tp * 100)}</em></div><div class="alt" style="margin:-4px 0 8px 130px">${d}</div>`).join('');
  // 30 günlük grafik
  const g30 = []; for (let i = 29; i >= 0; i--) { const d = new Date(bugun); d.setDate(d.getDate() - i); const x = G[gunAd(d)] || {}; g30.push({ d, s: topla(x, 'tek_sobe', 'online_sobe'), m: topla(x, 'tek_mantar', 'online_mantar') }); }
  const W = 900, H = 200, P = 26, gm = Math.max(1, ...g30.map(x => x.s + x.m)), bw = (W - P) / 30;
  let svg = `<svg viewBox="0 0 ${W} ${H + 20}" width="100%">`;
  g30.forEach((x, i) => { const hs = x.s / gm * H, hm = x.m / gm * H, X = P + i * bw + 2;
    svg += `<rect x="${X}" y="${H - hs}" width="${bw - 4}" height="${hs}" fill="#7fcf4f" rx="2"><title>${x.d.toLocaleDateString('tr-TR')}: ${x.s} saklambaç, ${x.m} mantar</title></rect>`;
    svg += `<rect x="${X}" y="${H - hs - hm}" width="${bw - 4}" height="${hm}" fill="#e8402f" rx="2"><title>${x.d.toLocaleDateString('tr-TR')}: ${x.s} saklambaç, ${x.m} mantar</title></rect>`;
    if (i % 5 === 4 || i === 29) svg += `<text x="${X + bw / 2 - 2}" y="${H + 15}" text-anchor="middle">${x.d.getDate()}.${x.d.getMonth() + 1}</text>`; });
  svg += `<text x="2" y="10">${gm}</text><line x1="${P}" x2="${W}" y1="${H}" y2="${H}" stroke="#2c4a35"/></svg>`;
  $('grafik').innerHTML = svg;
  const ck = Object.entries(T).filter(([k]) => k.startsWith('k_')).map(([k, s]) => [ADLAR[k.slice(2)] || k.slice(2), s]).sort((a, b) => b[1] - a[1]);
  const cm = Math.max(1, ...ck.map(x => x[1]));
  $('cocuklar').innerHTML = ck.length ? ck.map(([a, s]) => `<div class="cubuk"><span>${a}</span><i style="width:${s / cm * 100}%;background:#ffd84a"></i><em>${n(s)}</em></div>`).join('') : '<div class="alt">Henüz veri yok</div>';
  $('tablo').innerHTML = '<tr><th>Gün</th><th>Açılış</th><th>Oyun</th><th>Saklambaç</th><th>Mantar</th><th>Online</th><th>Tur</th></tr>' +
    gunler.slice(-30).reverse().map(g => { const x = G[g]; return `<tr><td>${g.split('-').reverse().join('.')}</td><td>${n(x.acilis)}</td><td>${n(x.oyun)}</td><td>${n(topla(x, 'tek_sobe', 'online_sobe'))}</td><td>${n(topla(x, 'tek_mantar', 'online_mantar'))}</td><td>${n(topla(x, 'online_sobe', 'online_mantar'))}</td><td>${n(topla(x, 'tur_sobe', 'tur_mantar'))}</td></tr>`; }).join('');
  $('zaman').textContent = 'Güncellendi: ' + new Date().toLocaleString('tr-TR');
  $('durum').hidden = true; $('icerik').hidden = false;
}
const yenile = () => yukle().then(ciz).catch(e => { $('durum').textContent = 'Okunamadı: ' + e.message; });
yenile(); setInterval(yenile, 60000);
</script>
</body>
</html>
